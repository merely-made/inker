[package]
rust-version = "1.97.1"
name = "graft-engine"
# Genet's workspace version, inlined when this crate landed in mere on
# 2026-09-03: mere's workspace version is 0.0.1 and the move is not a
# version decision. Unpublished either way.
version = "0.2.0"
edition.workspace = true
authors = ["Mark AB (markik)"]
# Not workspace: this crate is ours, not Servo-derived, so it keeps the founding
# license rather than inheriting genet's MPL-2.0.
license = "MPL-2.0"
repository.workspace = true
description = "inker SurfaceEngine implementation backed by the wgpu-graft Servo embedding (GL-FBO / DX12-shared / Vulkan-external-memory / IOSurface interop)."
publish = false

[lib]
path = "src/lib.rs"

[features]
default = []
# The concrete Servo producer, adapted from wgpu-graft's `grafting-servo`
# library the way scrying-engine adapts `scrying`. Off by default so ordinary
# inker/mere builds never compile Servo. The host that enables this must also
# enable `grafting-servo/servo` on its own dependency row: that feature is
# deliberately NOT forwarded from here, because a member crate that forwards it
# makes Cargo lock (and fetch) the Servo git tree for every workspace
# invocation, which is the cost this gating exists to avoid.
servo = ["dep:grafting-servo", "dep:wgpu", "dep:accesskit", "dep:serde_json"]
# Windows ANGLE/EGL instead of WGL; forwarded to Servo through grafting-servo.
# Same host-side rule as `servo`: also enable `grafting-servo/no-wgl` there.
no-wgl = ["servo"]

[dependencies]
inker.workspace = true
tracing.workspace = true
accesskit = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
# Servo itself is never named here: the library re-exports it (`servo`) and
# keeps its revision in wgpu-graft's manifests. The wgpu row is explicit so an
# imported texture comes from the same major as the host device.
grafting-servo = { git = "https://github.com/merely-made/wgpu-graft.git", branch = "main", default-features = false, features = ["wgpu-30"], optional = true }

[dev-dependencies]
accesskit.workspace = true

[lints]
workspace = true
